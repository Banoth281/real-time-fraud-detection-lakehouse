services:
  redpanda:
    image: redpandadata/redpanda:v24.3.3
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "384M", "--reserve-memory", "0M", "--node-id", "0", "--kafka-addr", "PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092"]
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: {memory: 512M}

  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: fraud, POSTGRES_PASSWORD: fraud, POSTGRES_DB: fraudlake}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraudlake"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits: {memory: 384M}

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    deploy:
      resources:
        limits: {memory: 384M}

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set lake http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing lake/fraud-lakehouse"]

  producer:
    build: .
    command: ["python", "-m", "src.producer.main"]
    env_file: .env
    depends_on: {redpanda: {condition: service_healthy}}
    deploy:
      resources:
        limits: {memory: 160M}

  processor:
    build: .
    command: ["python", "-m", "src.processor.main"]
    env_file: .env
    depends_on:
      redpanda: {condition: service_healthy}
      postgres: {condition: service_healthy}
      create-bucket: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {memory: 256M}

  api:
    build: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
    deploy:
      resources:
        limits: {memory: 192M}

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
    deploy:
      resources:
        limits: {memory: 192M}

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
    deploy:
      resources:
        limits: {memory: 256M}

volumes:
  postgres_data:
  minio_data:
